# 本案例为**虚构目标**（acme 示例甲方），全部资产使用 RFC 5737 文档网段
# 与 example.com 占位域名，不存在真实目标、真实凭据、真实数据。
# 用途：展示框架 finding 状态机、验证纪律与交付流程的完整闭环。
