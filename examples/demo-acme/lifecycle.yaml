    summary: |
      订单详情接口仅校验登录态未校验归属：将 id 替换为相邻订单号返回其他
      用户订单（脱敏样例：订单号 ORD-2026-08123、金额、收件地址哈希）。
      GET 只读验证 2 次即止，未批量拉取。
    poc: output/poc-acme-003.py
    replay_signature: '"order_no": "ORD-2026-08123"'
    money_ready: false
    missing: "缺影响面评估（可遍历订单规模）+ 甲方确认"
    trigger: null
    unlock_plan:
      trigger_what: null
      channel: null
      deadline: null
    evidence:
      - output/poc-acme-003.py
      - output/rounds/2026-08-12.md
    history:
      - {at: 2026-08-12T17:00:00+08:00, from: phenomenon, to: candidate, note: "A 账号订单响应含 id 字段，反射命中 id 参数 → IDOR 反证试替换"}
      - {at: 2026-08-12T17:30:00+08:00, from: candidate, to: verified, note: "反事实 4 问通过：(1) 替换 id=ORD-2026-08122 返回不同订单（A 账号下单号 08121）→ 归属未校验；(2) 无 Cookie 返回 401 → 确需登录，非未授权；(3) 假响应反证：换不存在的订单号返回 404 → 数据真实存在；(4) 证伪反例：假设是 A 账号自己的历史订单，比对下单记录订单号不包含 08123 → 无法推翻，verified"}
