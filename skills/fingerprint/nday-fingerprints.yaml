# N-day / 历史漏洞指纹库
#
# 用途: 把「产品/组件/版本指纹」与「高置信历史漏洞检查」绑定。
#       供 tools/nday-matcher.py 读取,在 recon/status 阶段自动提示攻击面。
#
# 设计原则:
#   - 只放有明显公开 N-day 或历史漏洞的产品/组件,不放纯技术栈(如 Java/PHP)
#   - 每个指纹必须带安全 GET 检查(status + hit_grep),不能上来就投 RCE payload
#   - 命中 ≠ verified;命中只表示「值得按对应 playbook/skill 深入」
#   - 新增指纹时尽量复用已有 playbook,没有则新建 memory/playbooks/playbook-<id>.md
#
# 字段说明:
#   id: 唯一 slug(小写、连字符)
#   name: 可读名称
#   product: 产品名
#   severity: critical | high | medium | low
#   tags: 扫描/召回标签
#   triggers: 命中条件列表,列表内每个元素是 OR 关系
#     - 直接条件: {type: path|header|body|title|server|cookie, value: 子串}
#     - all_of: 子条件全部匹配(AND)
#     - any_of: 子条件任意匹配(OR)
#   playbook/skill: 后续打法文档(至少一个)
#   checks: 安全 GET 探测,用于确认指纹/判断补丁
#     - name: 检查名
#     - path: 相对路径,支持 {base} 占位(会被 base_url 替换)
#     - method: GET(默认)
#     - headers: dict(可选)
#     - status: 期望状态码列表(可选)
#     - hit_grep: 命中特征(子串,大小写不敏感)
#     - fixed_grep: 已修复特征(可选)
#     - note: 人工备注
#     - command: 推荐命令(可选,用于报告展示)
#     - scanner_tags: 传给 scanner-dispatch.py --tags 的标签(可选)

fingerprints:
  - id: seeyon-a8
    name: 致远互联 OA A8 反序列化 / 文件上传
    product: 致远互联 Seeyon OA A8 / M3
    severity: critical
    tags: [seeyon, a8, oa, deserialization, upload, java]
    triggers:
      - type: path
        value: "/seeyon/"
      - type: header
        value: "Server: Coyote"
      - type: body
        value: "M3"
    playbook: memory/playbooks/playbook-seeyon-a8-deserialization.md
    skill: skills/fingerprint/nday-matcher.md
    checks:
      - name: htmlofficeservlet 是否存在
        path: /seeyon/htmlofficeservlet
        status: ["200", "405", "500"]
        hit_grep: htmlofficeservlet
        note: A8 历史反序列化/任意文件上传入口;下一步按 playbook 构造 PoC,必须请示重武器
        command: "curl -sk -m 10 -o /dev/null -w '%{http_code}' {base}/seeyon/htmlofficeservlet"
        scanner_tags: cve,seeyon

